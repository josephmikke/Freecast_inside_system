service: cms-api


# Disable Serverless Dashboard
org: null
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: freecast-cms

build:
  esbuild: false

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  logRetentionInDays: 3
  memorySize: 1024
  timeout: 30
  apiGateway:
    description: CMS REST API
    apiKeys:
      - ${sls:stage}-cms
  tracing:
    apiGateway: true
    lambda: true
  stackTags:
    project: freecast-infra
  environment:
    ${file(sls-resources/environment.yml)}
  iam:
    ${file(sls-resources/iam.yml):iam}
#TODO: move this in a env file
