    spekeRoleArn: 'arn:aws:iam::199718138082:role/live-pipeline-prod-MediaPackageInvokeApiRole-APY7IZHJWBX2'
    wafArn: 'arn:aws:wafv2:us-east-1:199718138082:global/webacl/prod-DistributionACL/dfc706c0-1be2-457d-8fc4-e8a0fb8679f1'
  dev:
