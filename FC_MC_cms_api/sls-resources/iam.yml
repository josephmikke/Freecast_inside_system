iam:
  role:
      statements:
        - Effect: Allow
          Action: 'dynamodb:*'
          Resource:
            - !GetAtt cmsTable.Arn
            - !Join [ "/", [ !GetAtt cmsTable.Arn, "index", "GSI1"]]
            - !Join [ "/", [ !GetAtt cmsTable.Arn, "index", "GSI2"]]
            - !Join [ "/", [ !GetAtt cmsTable.Arn, "index", "GSI3"]]
            - !Join [ "/", [ !GetAtt cmsTable.Arn, "index", "GSI4"]]
            - !Join [ "/", [ !GetAtt cmsTable.Arn, "index", "GSI5"]]
            # Add permissions for existing cms-log table using Fn::Sub
            - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/cms-log"
            - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/cms-log/index/*"
        - Effect: Allow
          Action: 's3:*'
          Resource:
            - !Join [ '/', [ !GetAtt cmsAssetsBucket.Arn, '*' ] ]
        - Effect: Allow
          Action:
            - 's3:PutObject'
            - 's3:GetObject'
            - 's3:ListBucket'
            - 's3:PutObjectAcl'
          Resource:
            - arn:aws:s3:::sony-freecast
            - arn:aws:s3:::sony-freecast/*
        - Effect: Allow
          Action: 'lambda:InvokeFunction'
          Resource:
            - !Join
              - ":"
              - - arn
                - aws
                - lambda
                - !Ref AWS::Region
                - !Ref AWS::AccountId
                - "function:${self:service}-${sls:stage}-scheduleHandler"
            - !Join
              - ":"
              - - arn
                - aws
                - lambda
                - !Ref AWS::Region
                - !Ref AWS::AccountId
                - "function:${self:service}-${sls:stage}-handleIngestedVod"
            - !Join
              - ":"
              - - arn
                - aws
                - lambda
                - !Ref AWS::Region
                - !Ref AWS::AccountId
                - "function:${self:service}-${sls:stage}-logHandler"
        - Effect: Allow
          Action:
            - 'wafv2:*'
            - 'scheduler:*'
            - 'mediapackage-vod:*'
            - 'mediatailor:*'
            - iam:GetRole
            - iam:PassRole
            - 'apigateway:GET'
            - 'mediapackage:DescribeChannel'
            - 'mediapackage:DescribeHarvestJob'
            - 'mediapackage:DescribeOriginEndpoint'
            - 'mediapackage:CreateHarvestJob'
            - 'mediaconvert:CreateJob'
            - 'medialive:BatchUpdateSchedule'
            - 'medialive:DeleteSchedule'
            - 'states:StartExecution'
            - 'events:Put*'
          Resource: '*'
        - Effect: Allow
          Action:
            - 'cloudfront:CreateInvalidation'
          Resource:
            - !Join
              - ":"
              - - arn
                - aws
                - cloudfront
                - ""
                - !Ref AWS::AccountId
                - !Join
                  - "/"
                  - - distribution
                    - !GetAtt vodDistribution.Id
        - Effect: Allow
          Action: 'logs:CreateLogGroup'
          Resource:
            - Fn::Sub: "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
        - Effect: Allow
          Action: 'sns:Publish'
          Resource:
            - Fn::Sub: "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:EPG-Issue-Notification"
            - Fn::Sub: "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:MediaConnect-Disconnected"
            - Fn::Sub: "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:LTN-Channels-Notification"
        - Effect: Allow
          Action: 'lambda:InvokeFunction'
          Resource:
            - Fn::Sub: "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-validateAllEPGs"
        - Effect: Allow
          Action:
            - 'logs:CreateLogStream'
            - 'logs:PutLogEvents'
          Resource:
            - Fn::Sub: "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-epg-analytics-auto-fix:*"

resources:
  Resources:
    SchedulerInvokeRole:
      Type: 'AWS::IAM::Role'
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: scheduler.amazonaws.com
              Action:
                - 'sts:AssumeRole'
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
        Path: /
        Policies:
          - PolicyName: "Execution-Policy"
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - 'lambda:InvokeFunction'
                  Resource:
                    - !Join
                      - ":"
                      - - arn
                        - aws
                        - lambda
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - "function:${self:service}-${sls:stage}-scheduleHandler" # TODO: rename epg scheduler to avoid confusion
                    - !Join
                       - ":"
                       - - arn
                         - aws
                         - lambda
                         - !Ref AWS::Region
                         - !Ref AWS::AccountId
                         - "function:${self:service}-${sls:stage}-autoIngestionScheduleHandler"
                    - !Join
                       - ":"
                       - - arn
                         - aws
                         - lambda
                         - !Ref AWS::Region
                         - !Ref AWS::AccountId
                         - "function:${self:service}-${sls:stage}-recordingHandler"
    NpvrAutomationRemoverSchedulerInvokeRole:
      Type: 'AWS::IAM::Role'
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: scheduler.amazonaws.com
              Action:
                - 'sts:AssumeRole'
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
        Path: /
        Policies:
          - PolicyName: "NPVR-Automatic-Remover-Execution-Policy"
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - 'lambda:InvokeFunction'
                  Resource:
                    - !Join
                      - ":"
                      - - arn
                        - aws
                        - lambda
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - "function:${self:service}-${sls:stage}-npvr-automatic-remover"
                    - !Join
                      - ":"
                      - - arn
                        - aws
                        - lambda
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - "function:${self:service}-${sls:stage}-npvr-automatic-remover"
                        - "*"
    NpvrAutomationRemoverSchedule:
      Type: 'AWS::Scheduler::Schedule'
      Properties:
        Name: "${self:service}-${sls:stage}-npvr-automatic-remover"
        Description: "Daily trigger for npvr automatic remover"
        State: ENABLED
        FlexibleTimeWindow:
          Mode: OFF
        ScheduleExpression: "cron(0 9 * * ? *)"
        ScheduleExpressionTimezone: "UTC"
        Target:
          Arn: !Join
            - ":"
            - - arn
              - aws
              - lambda
              - !Ref AWS::Region
              - !Ref AWS::AccountId
              - "function:${self:service}-${sls:stage}-npvr-automatic-remover"
          RoleArn: !GetAtt NpvrAutomationRemoverSchedulerInvokeRole.Arn
    EpgAnalyticsAutoFixSchedulerInvokeRole:
      Type: 'AWS::IAM::Role'
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: scheduler.amazonaws.com
              Action:
                - 'sts:AssumeRole'
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
        Path: /
        Policies:
          - PolicyName: "EPG-Analytics-Auto-Fix-Execution-Policy"
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - 'lambda:InvokeFunction'
                  Resource:
                    - !Join
                      - ":"
                      - - arn
                        - aws
                        - lambda
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - "function:${self:service}-${sls:stage}-epg-analytics-auto-fix"
                    - !Join
                      - ":"
                      - - arn
                        - aws
                        - lambda
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - "function:${self:service}-${sls:stage}-epg-analytics-auto-fix"
                        - "*"
    EpgAnalyticsAutoFixWeekdaysSchedule:
      Type: 'AWS::Scheduler::Schedule'
      Properties:
        Name: "${self:service}-${sls:stage}-epg-analytics-auto-fix-weekdays"
        Description: "Trigger EPG analytics auto-fix every 2 hours on weekdays (days 1-5)"
        State: ENABLED
        FlexibleTimeWindow:
          Mode: OFF
        ScheduleExpression: "cron(0 0/2 ? * 1-5 *)"
        ScheduleExpressionTimezone: "UTC"
        Target:
          Arn: !Join
            - ":"
            - - arn
              - aws
              - lambda
              - !Ref AWS::Region
              - !Ref AWS::AccountId
              - "function:${self:service}-${sls:stage}-epg-analytics-auto-fix"
          RoleArn: !GetAtt EpgAnalyticsAutoFixSchedulerInvokeRole.Arn
    EpgAnalyticsAutoFixWeekendsSchedule:
      Type: 'AWS::Scheduler::Schedule'
      Properties:
        Name: "${self:service}-${sls:stage}-epg-analytics-auto-fix-weekends"
        Description: "Trigger EPG analytics auto-fix every hour on weekends (days 6,7)"
        State: ENABLED
        FlexibleTimeWindow:
          Mode: OFF
        ScheduleExpression: "cron(0 0/1 ? * 6,7 *)"
        ScheduleExpressionTimezone: "UTC"
        Target:
          Arn: !Join
            - ":"
            - - arn
              - aws
              - lambda
              - !Ref AWS::Region
              - !Ref AWS::AccountId
              - "function:${self:service}-${sls:stage}-epg-analytics-auto-fix"
          RoleArn: !GetAtt EpgAnalyticsAutoFixSchedulerInvokeRole.Arn
    MediaConvertJobRole:
      Type: 'AWS::IAM::Role'
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: mediaconvert.amazonaws.com
              Action:
                - 'sts:AssumeRole'
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
        Path: /
        Policies:
          - PolicyName: "MediaConvert-Job-Vod"
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - 'mediaconvert:*'
                  Resource:
                    - '*'
                - Effect: Allow
                  Action:
                    - 's3:GetObject'
                  Resource:
                    - '*'
                - Effect: Allow
                  Action:
                    - 's3:PutObject'
                  Resource:
                    - !Join
                      - ''
                      - - 'arn:aws:s3:::'
                        - !Ref cmsAssetsBucket
                        - /episodes/*
                    - !Join
                      - ''
                      - - 'arn:aws:s3:::'
                        - !Ref cmsAssetsBucket
                        - /movies/*
                    - !Join
                      - ''
                      - - 'arn:aws:s3:::'
                        - !Ref cmsAssetsBucket
                        - /series/*
    MediaPackageASM:
      Type: 'AWS::IAM::Role'
      Properties:
        RoleName: ${sls:stage}-MediaPackageASM
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: mediapackage.amazonaws.com
              Action:
                - 'sts:AssumeRole'
        Path: /
        Policies:
          - PolicyName: "${sls:stage}-SecretsManagerForMediaPackage"
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - secretsmanager:GetResourcePolicy
                    - secretsmanager:GetSecretValue
                    - secretsmanager:DescribeSecret
                    - secretsmanager:ListSecretVersionId
                  Resource: '*'
