Resources:
  # DynamoDB Table
  cmsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cms-${sls:stage}
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: 'GSI1'
          Projection:
            ProjectionType: ALL
          KeySchema:
            - AttributeName: GSI1-PK
              KeyType: HASH
            - AttributeName: GSI1-SK
              KeyType: RANGE
        - IndexName: 'GSI2'
          Projection:
            ProjectionType: ALL
          KeySchema:
            - AttributeName: GSI2-PK
              KeyType: HASH
            - AttributeName: GSI2-SK
              KeyType: RANGE
        - IndexName: 'GSI3'
          Projection:
            ProjectionType: ALL
          KeySchema:
            - AttributeName: GSI3-PK
              KeyType: HASH
            - AttributeName: GSI3-SK
              KeyType: RANGE
        - IndexName: 'GSI4'
          Projection:
            ProjectionType: ALL
          KeySchema:
            - AttributeName: GSI4-PK
              KeyType: HASH
            - AttributeName: GSI4-SK
              KeyType: RANGE
        - IndexName: 'GSI5'
          Projection:
            ProjectionType: ALL
          KeySchema:
            - AttributeName: GSI5-PK
              KeyType: HASH
            - AttributeName: GSI5-SK
              KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1-PK
          AttributeType: S
        - AttributeName: GSI1-SK
          AttributeType: S
        - AttributeName: GSI2-PK
          AttributeType: S
        - AttributeName: GSI2-SK
          AttributeType: S
        - AttributeName: GSI3-PK
          AttributeType: S
        - AttributeName: GSI3-SK
          AttributeType: S
        - AttributeName: GSI4-PK
          AttributeType: S
        - AttributeName: GSI4-SK
          AttributeType: S
        - AttributeName: GSI5-PK
          AttributeType: S
        - AttributeName: GSI5-SK
          AttributeType: N

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
