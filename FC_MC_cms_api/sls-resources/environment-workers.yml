ENV: ${sls:stage}
NODE_OPTIONS: --enable-source-maps
CMS_TABLE_NAME: cms-${sls:stage}
CMS_LOG_TABLE_NAME: cms-log
VOD_STATE_MACHINE_ARN: !Join
  - ":"
  - - arn
    - aws
    - states
    - !Ref AWS::Region
    - !Ref AWS::AccountId
    - "stateMachine:${self:custom.cmsApiService}-${sls:stage}-vodStateMachine"
BUSNAME: ${sls:stage}-cms
