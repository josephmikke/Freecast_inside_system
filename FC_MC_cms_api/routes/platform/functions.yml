addPlatform:
  handler: routes/platform/addPlatform/index.default
  events:
    - http:
        path: 'platforms'
        cors: true
        method: post
        private: true
getPlatforms:
  handler: routes/platform/getPlatforms/index.default
  events:
    - http:
        path: 'platforms'
        cors: true
        method: get
        private: true
updatePlatform:
  handler: routes/platform/updatePlatform/index.default
  events:
    - http:
        path: 'platforms/{id}'
        cors: true
        method: patch
        request:
          parameters:
            paths:
              id: true
        private: true
deletePlatform:
  handler: routes/platform/deletePlatform/index.default
  events:
    - http:
        path: 'platforms/{id}'
        cors: true
        method: delete
        request:
          parameters:
            paths:
              id: true
        private: true
