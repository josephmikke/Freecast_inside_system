addEPGTemplate:
  handler: routes/epgTemplate/addEPGTemplate/index.default
  events:
    - http:
        path: 'epgTemplates'
        cors: true
        method: post
        private: true
getEpgTemplates:
  handler: routes/epgTemplate/getEPGTemplates/index.default
  events:
    - http:
        path: 'epgTemplates'
        cors: true
        method: get
        private: true
updateEPGTemplate:
  handler: routes/epgTemplate/updateEPGTemplate/index.default
  events:
    - http:
        path: 'epgTemplates/{id}'
        cors: true
        method: patch
        request:
          parameters:
            paths:
              id: true
        private: true
deleteEPGTemplate:
  handler: routes/epgTemplate/deleteEPGTemplate/index.default
  events:
    - http:
        path: 'epgTemplates/{id}'
        cors: true
        method: delete
        request:
          parameters:
            paths:
              id: true
        private: true
