addGenre:
  handler: routes/genre/addGenre/index.default
  events:
    - http:
        path: 'genres'
        cors: true
        method: post
        private: true
getGenres:
  handler: routes/genre/getGenres/index.default
  events:
    - http:
        path: 'genres'
        cors: true
        method: get
        private: true
updateGenre:
  handler: routes/genre/updateGenre/index.default
  events:
    - http:
        path: 'genres/{id}'
        cors: true
        method: patch
        request:
          parameters:
            paths:
              id: true
        private: true
updateGenreWeight:
  handler: routes/genre/updateGenreWeight/index.default
  events:
    - http:
        path: 'genres/{id}/weight/{index}'
        cors: true
        method: get
        request:
          parameters:
            paths:
              id: true
              index: true
        private: true
deleteGenre:
  handler: routes/genre/deleteGenre/index.default
  events:
    - http:
        path: 'genres/{id}'
        cors: true
        method: delete
        request:
          parameters:
            paths:
              id: true
        private: true