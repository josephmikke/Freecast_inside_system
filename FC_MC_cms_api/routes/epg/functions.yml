addEPG:
  handler: routes/epg/addEPG/index.default
  events:
    - http:
        path: 'epg'
        cors: true
        method: post
        private: true
addEPGProgram:
  handler: routes/epg/addEPGProgram/index.default
  events:
    - http:
        path: 'epg/{id}/program'
        cors: true
        method: post
        request:
          parameters:
            paths:
              id: true
        private: true
